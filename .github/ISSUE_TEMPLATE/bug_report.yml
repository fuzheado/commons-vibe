name: 🐛 Bug report
description: Report something that isn't working — empty feed, wrong view, broken interaction, console errors
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! CommonsVibe captures its entire state in the URL, so the exact link
        is the single most useful thing you can share.
  - type: input
    id: url
    attributes:
      label: Link you were viewing
      description: Paste the full URL from the address bar (it contains the category, sort, view and filter state — e.g. `?cat=…&sort=shuffle&view=min`).
      placeholder: "https://commons-vibe.toolforge.org/?cat=Category%3A…"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Category name, mode (Alphabetical / Shuffle / Deep shuffle), view (Detailed / Minimal), tile size (S/M/L), media filter (All / Images / Video / Audio) — anything that might matter.
      placeholder: |
        1. Opened the app and searched for "…"
        2. Toggled …
        3. Scrolled …
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser and operating system were you using?
      options:
        - Chrome / Chromium (desktop)
        - Firefox (desktop)
        - Safari (desktop)
        - Edge (desktop)
        - Mobile browser (iOS / Android)
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: Any red errors in the browser console (F12 → Console). A missing-favicon 404 and a Tailwind CDN warning are known and harmless.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, related categories, how often it happens… the more context, the faster we can fix it.
